<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            color: white;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                to bottom,
                #071a35 0%,
                #0b2548 30%,
                #102f52 55%,
                #071526 78%,
                #020812 100%
            );

            background-attachment: fixed;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;

            background: rgba(2, 10, 25, 0.9);
            backdrop-filter: blur(10px);

            border-bottom: 1px solid rgba(80, 160, 255, 0.15);

            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .money-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance {
            background: rgba(22, 119, 210, 0.2);
            border: 1px solid rgba(80, 160, 255, 0.3);

            padding: 10px 15px;
            border-radius: 10px;

            font-weight: bold;
        }

        .pay-text {
            color: #8fb9df;
            font-size: 14px;
        }

        .cashout {
            padding: 10px 16px;
            font-size: 14px;
            background: #148a55;
        }

        .cashout:hover {
            background: #1aaa6a;
        }

        .hero {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding-top: 70px;
        }

        h1 {
            font-size: 80px;
            font-weight: 800;
            letter-spacing: 4px;

            text-shadow:
                0 0 25px rgba(80, 160, 255, 0.4);
        }

        .subtitle {
            margin-top: 15px;
            font-size: 20px;
            color: #a9c8e8;
        }

        .buttons {
            margin-top: 35px;

            display: flex;
            gap: 15px;
        }

        button {
            padding: 15px 30px;

            border: none;
            border-radius: 10px;

            background: #1677d2;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #2990ed;

            transform: translateY(-3px);

            box-shadow:
                0 8px 25px rgba(20, 120, 220, 0.35);
        }

        .panel {
            display: none;

            margin-top: 30px;

            width: 380px;
            max-width: 90vw;

            padding: 30px;

            background: rgba(3, 15, 32, 0.95);

            border: 1px solid rgba(80, 160, 255, 0.4);

            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .panel h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .panel p {
            color: #a9c8e8;
            margin-bottom: 20px;
        }

        .coin {
            width: 100px;
            height: 100px;

            margin: 20px auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #d9a441;

            border: 5px solid #f5cf70;

            color: #513900;

            font-size: 17px;
            font-weight: bold;
        }

        .flipping {
            animation: flip 0.8s linear;
        }

        @keyframes flip {
            0% {
                transform: rotateY(0deg);
            }

            100% {
                transform: rotateY(1080deg);
            }
        }

        .bet-input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #315d89;
            border-radius: 9px;

            background: #071a35;

            color: white;

            font-size: 16px;

            outline: none;
        }

        #result {
            margin-top: 20px;
            min-height: 25px;

            font-size: 19px;
            font-weight: bold;
        }

        .win {
            color: #55e38a;
        }

        .lose {
            color: #ff6868;
        }

        #donateResult,
        #cashoutResult {
            margin-top: 20px;
            color: #a9c8e8;
        }

        .section {
            min-height: 500px;
            padding: 100px 20px;
            text-align: center;
        }

        .section h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .section p {
            color: #a9c8e8;
        }

        @media (max-width: 700px) {

            .topbar {
                height: auto;
                min-height: 70px;
                padding: 12px 15px;

                flex-wrap: wrap;
                gap: 10px;
            }

            .money-area {
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .pay-text {
                display: none;
            }

            h1 {
                font-size: 50px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <div class="topbar">

        <div class="logo">
            DONUTHUB
        </div>

        <div class="money-area">

            <div class="balance">
                💰 <span id="balance">10,000</span>
            </div>

            <div class="pay-text">
                /pay Julianninja12 to add
            </div>

            <button
                class="cashout"
                onclick="cashOut()">
                CASH OUT
            </button>

        </div>

    </div>


    <!-- MAIN -->

    <div class="hero">

        <h1>DONUTHUB</h1>

        <p class="subtitle">
            Your DonutSMP community hub
        </p>


        <div class="buttons">

            <button onclick="openCoinFlip()">
                🪙 COIN FLIP
            </button>

            <button onclick="openDonate()">
                ❤️ DONATE
            </button>

        </div>


        <!-- COIN FLIP -->

        <div id="coinFlipPanel" class="panel">

            <h2>🪙 Coin Flip</h2>

            <p>
                Use demo coins to flip the coin.
            </p>

            <div id="coin" class="coin">
                ?
            </div>

            <input
                id="betAmount"
                class="bet-input"
                type="number"
                min="1"
                placeholder="Demo coins to use">

            <button onclick="flipCoin()">
                FLIP COIN
            </button>

            <div id="result"></div>

        </div>


        <!-- DONATE -->

        <div id="donatePanel" class="panel">

            <h2>❤️ Donate</h2>

            <p>
                Support DonutHub!
            </p>

            <button onclick="donate()">
                DONATE DEMO COINS
            </button>

            <div id="donateResult"></div>

        </div>


        <!-- CASH OUT -->

        <div id="cashoutPanel" class="panel">

            <h2>💵 Cash Out</h2>

            <p>
                Cash-out is currently a demo feature.
            </p>

            <button onclick="closeCashOut()">
                CLOSE
            </button>

            <div id="cashoutResult"></div>

        </div>

    </div>


    <div class="section">

        <h2>DonutSMP</h2>

        <p>
            More DonutHub features coming soon...
        </p>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        let balance = 10000;


        function openCoinFlip() {

            document.getElementById("coinFlipPanel")
                .style.display = "block";

            document.getElementById("donatePanel")
                .style.display = "none";

            document.getElementById("cashoutPanel")
                .style.display = "none";
        }


        function openDonate() {

            document.getElementById("donatePanel")
                .style.display = "block";

            document.getElementById("coinFlipPanel")
                .style.display = "none";

            document.getElementById("cashoutPanel")
                .style.display = "none";
        }


        function cashOut() {

            document.getElementById("cashoutPanel")
                .style.display = "block";

            document.getElementById("coinFlipPanel")
                .style.display = "none";

            document.getElementById("donatePanel")
                .style.display = "none";
        }


        function closeCashOut() {

            document.getElementById("cashoutPanel")
                .style.display = "none";

        }


        function flipCoin() {

            const input =
                document.getElementById("betAmount");

            const result =
                document.getElementById("result");

            const coin =
                document.getElementById("coin");

            const bet =
                Number(input.value);


            if (!bet || bet <= 0) {

                result.className = "lose";
                result.textContent =
                    "Enter a valid amount!";

                return;
            }


            if (bet > balance) {

                result.className = "lose";
                result.textContent =
                    "Not enough demo coins!";

                return;
            }


            balance -= bet;

            updateBalance();


            coin.classList.remove("flipping");

            void coin.offsetWidth;

            coin.classList.add("flipping");


            result.className = "";
            result.textContent = "Flipping...";


            setTimeout(function() {

                const heads =
                    Math.random() < 0.5;


                if (heads) {

                    balance += bet * 2;

                    coin.textContent = "HEADS";

                    result.className = "win";

                    result.textContent =
                        "🪙 HEADS! You won " +
                        bet +
                        " demo coins!";

                } else {

                    coin.textContent = "TAILS";

                    result.className = "lose";

                    result.textContent =
                        "🪙 TAILS! You lost " +
                        bet +
                        " demo coins!";

                }


                updateBalance();

            }, 800);

        }


        function donate() {

            document.getElementById("donateResult")
                .textContent =
                "Demo donation button pressed!";

        }


        function updateBalance() {

            document.getElementById("balance")
                .textContent =
                balance.toLocaleString();

        }

    </script>

</body>
</html>
